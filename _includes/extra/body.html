<script>
(function () {
  var oldPath = window.location.pathname;
  var newBase = 'https://f3rc-committee.org';
  var newPath = oldPath.replace(/^\/F3RC2025\//, '/過去の大会/2025/');
  var newUrl = newBase + newPath;

  var overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:#fff;display:flex;align-items:center;justify-content:center;z-index:9999;font-family:sans-serif;';
  overlay.innerHTML =
    '<div style="text-align:center;line-height:2.2;">' +
    '<h2 style="margin-bottom:0.5em;">サイト移転のお知らせ</h2>' +
    '<p>F³RC公式サイトは2026年度より <a href="' + newBase + '"><strong>f3rc-committee.org</strong></a> に移転しました。</p>' +
    '<p><span id="redirect-countdown">10</span> 秒後に自動で移動します。</p>' +
    '<p><a href="' + newUrl + '">今すぐ移動する →</a></p>' +
    '</div>';

  document.body.appendChild(overlay);

  var el = document.getElementById('redirect-countdown');
  var count = 10;

  var timer = setInterval(function () {
    count--;
    el.textContent = count;
    if (count <= 0) {
      clearInterval(timer);
      window.location.replace(newUrl);
    }
  }, 1000);
})();
</script>
